<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selected Work / Rolin Portfolio</title>
    <meta
      name="description"
      content="Selected campaign, illustration, brand, packaging, 3D and AIGC work by Rolin."
    />
    <link rel="stylesheet" href="./work.css?v=54" />
    <link rel="stylesheet" href="./global-nav.css?v=2" />
  </head>
  <body>
    <header class="work-header global-nav">
      <a class="work-back" href="./index.html">Back</a>
      <nav class="global-nav__right" aria-label="Project navigation">
        <a href="./index.html#project">Project</a>
        <a href="./about.html">About and Contact</a>
      </nav>
    </header>

    <main class="work-layout">
      <aside class="work-aside" aria-live="polite">
        <div class="aside-coordinates">
          <span>Rolin / Selected Work</span>
          <span class="aside-count">01 / 04</span>
        </div>

        <div class="aside-content">
          <dl class="aside-meta">
            <div>
              <dt>Work</dt>
              <dd class="aside-title"></dd>
            </div>
            <div>
              <dt>Description</dt>
              <dd class="aside-description"></dd>
            </div>
            <div>
              <dt>Focus</dt>
              <dd class="aside-focus"></dd>
            </div>
            <div>
              <dt>Year</dt>
              <dd class="aside-year"></dd>
            </div>
          </dl>
        </div>

        <div class="aside-progress" aria-hidden="true">
          <span class="aside-progress-number">00</span>
          <div><i></i></div>
        </div>
      </aside>

      <section class="media-stream" aria-label="Project media"></section>
    </main>

    <div class="next-section-transition" aria-hidden="true">
      <video
        class="next-section-transition__video"
        src="./assets/transitions/next-section.mp4"
        muted
        playsinline
        preload="metadata"
      ></video>
      <p class="next-section-transition__label" aria-hidden="true"></p>
    </div>

    <script src="./work.js?v=95"></script>
  </body>
</html>
